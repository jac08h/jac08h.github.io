---
layout: default
---

<style>
  #main_content figure {
    margin: 1.5em 0;
    text-align: center;
  }
  #main_content figure img {
    max-width: 100%;
    max-height: 500px;
    height: auto;
    display: inline-block;
  }
  #main_content figcaption {
    margin-top: 0.5em;
    font-size: 0.85em;
    font-style: italic;
    opacity: 0.7;
  }
  .post-meta {
    display: flex;
    align-items: baseline;
    gap: 0.75em;
    flex-wrap: wrap;
  }
  .post-meta .substack-link {
    font-size: 0.85em;
  }
  #main_content sup a {
    text-decoration: none;
    padding: 0 2px;
  }
  #main_content .footnotes {
    margin-top: 2.5em;
    padding-top: 1em;
    border-top: 1px dotted #444;
    list-style: none;
    counter-reset: footnote;
    padding-left: 0;
  }
  #main_content .footnotes li {
    counter-increment: footnote;
    position: relative;
    padding-left: 2.2em;
    margin: 1em 0;
    opacity: 0.85;
    font-size: 0.9em;
  }
  #main_content .footnotes li::before {
    content: counter(footnote);
    position: absolute;
    left: 0;
    top: 0;
    color: #6d6;
  }
  #main_content .footnotes li p {
    margin: 0;
  }
  #main_content .footnote-backref {
    text-decoration: none;
    margin-left: 0.4em;
  }
</style>

<div class="post-meta">
  <small>{{ page.date | date: "%-d %B %Y" }}</small>
  {% if page.substack_url %}
    <small class="substack-link">&middot; <a href="{{ page.substack_url }}">Read on Substack</a></small>
  {% endif %}
  <small class="substack-link">&middot; <a href="{{ '/blog/' | relative_url }}">All posts</a></small>
</div>
<h1>{{ page.title }}</h1>

{{content}}
