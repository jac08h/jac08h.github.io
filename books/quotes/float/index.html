<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Quotes — Book Quotes</title>
    <link rel="stylesheet" href="float.css">
</head>
<body>
    <header class="float-header">
        <h1>Floating Quotes</h1>
        <nav class="float-nav">
            <a href="/books/quotes/library/">📚 Library</a>
            <a href="/books/quotes/all">🔤 Alphabetical index</a>
        </nav>
    </header>

    <div id="field" class="field" aria-label="Drifting quote notes">
        <p id="loading" class="loading">Loading quotes…</p>
    </div>

    <div id="backdrop" class="backdrop" hidden></div>

    <div id="focused" class="focused-note" hidden role="dialog" aria-modal="true" aria-label="Quote">
        <button id="close-btn" class="close-btn" aria-label="Close">✕</button>
        <p class="focused-text" id="focused-text"></p>
        <p class="focused-caption" id="focused-caption"></p>
    </div>

    <script src="float.js"></script>
</body>
</html>
